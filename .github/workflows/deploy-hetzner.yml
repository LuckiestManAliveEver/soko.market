name: Build and deploy Hetzner

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built commit after checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: hetzner-production
  cancel-in-progress: false

env:
  NODE_VERSION: 20.19.0
  PNPM_VERSION: 10.28.2
  IMAGE_PREFIX: ${{ vars.PRODUCTION_IMAGE_PREFIX }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Validate production Compose
        env:
          ACME_EMAIL: ci@example.test
          API_DOMAIN: api.example.test
          FRONTEND_ORIGIN: https://example.test
          WEB_PUBLIC_URL: https://example.test
          AUTH_ALLOWED_REDIRECT_ORIGINS: https://example.test
          WEBAUTHN_RP_ID: example.test
          POSTGRES_PASSWORD: ci-not-a-secret
          DATABASE_URL: postgresql://ci:ci@postgres:5432/ci
          DIRECT_DATABASE_URL: postgresql://ci:ci@postgres:5432/ci
          REDIS_PASSWORD: ci-not-a-secret
          REDIS_URL: redis://:ci@redis:6379
          R2_ENDPOINT: https://example.r2.cloudflarestorage.com
          R2_BUCKET_NAME: ci-bucket
          R2_ACCESS_KEY_ID: ci-access-key
          R2_SECRET_ACCESS_KEY: ci-secret-key
          BACKUP_ENCRYPTION_PASSWORD: ci-backup-password-long-enough
          OTP_HMAC_SECRET: ci-otp-secret
          PIN_HASH_SECRET: ci-pin-secret
          AUTH_TOKEN_ENCRYPTION_KEY: ci-auth-encryption-key
          OAUTH_TOKEN_ENCRYPTION_KEY: ci-oauth-encryption-key
          INFERENCE_SERVICE_TOKEN: ci-inference-service-token-32-characters
          INFERENCE_JOB_SIGNING_SECRET: ci-inference-signing-token-32-characters
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: services/api/Dockerfile
          - name: ai-runtime
            context: .
            dockerfile: services/ai-runtime/Dockerfile
          - name: receipt-ocr
            context: services/receipt-ocr-service
            dockerfile: Dockerfile
          - name: postgres-backup
            context: .
            dockerfile: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Require registry prefix
        run: test -n "${IMAGE_PREFIX}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: ${{ inputs.deploy }}
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOST: ${{ secrets.HETZNER_SSH_KNOWN_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOST}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_DIR: ${{ vars.HETZNER_DEPLOY_DIR }}
        run: |
          scp docker-compose.production.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/docker-compose.production.yml"
          scp infra/caddy/Caddyfile "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/infra/caddy/Caddyfile"
          scp scripts/deploy-hetzner.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/scripts/deploy-hetzner.sh"

      - name: Deploy immutable image set
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_DIR: ${{ vars.HETZNER_DEPLOY_DIR }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 750 '${DEPLOY_DIR}/scripts/deploy-hetzner.sh' && DEPLOY_DIR='${DEPLOY_DIR}' '${DEPLOY_DIR}/scripts/deploy-hetzner.sh' '${GITHUB_SHA}'"
