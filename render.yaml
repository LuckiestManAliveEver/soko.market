services:
  - type: web
    name: soko-market-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm exec tsx services/api/src/index.ts
    healthCheckPath: /health
    domains:
      - api.soko.market
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: MONGODB_URI
        sync: false

  - type: web
    name: soko-market-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @soko/web build
    staticPublishPath: apps/web/dist
    domains:
      - soko.market
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.soko.market
