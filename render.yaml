services:
  - type: web
    name: soko-market-api
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: starter
    region: oregon
    # Build order is deliberately compile-and-verify-first: the new application code must prove
    # it builds and passes every static gate (including check:retired-runtime-references) BEFORE
    # any migration touches the shared production database. db:migrate can include destructive,
    # already-applied-in-production steps (see infra/db/migrations/065_retire_execution_fabric.sql
    # and docs/architecture/native-runtime-deployment.md); running it only after build:production
    # succeeds means a failed build can never leave the schema migrated out from under whatever
    # instance is still serving traffic on the previous deploy.
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm build:production && COREPACK_HOME=/tmp/corepack corepack pnpm db:migrate && REQUIRE_NEON_DATABASE=true COREPACK_HOME=/tmp/corepack corepack pnpm db:verify-schema
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api start
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
        - scripts/**
        - vendor/**
    domains:
      - api.soko.market
      # Store subdomain resolution (docs/architecture/soko-id-slug-system.md §4): this service's
      # onRequest hook (services/api/src/app.ts) already resolves {handle}.soko.market and
      # 302-redirects to the real storefront, excluding api./www. subdomains and the bare apex.
      # This line registers the wildcard domain in Render; it stays unverified/inert until a
      # matching wildcard DNS record (e.g. a CNAME for *.soko.market) is added at whatever
      # registrar manages soko.market's DNS, pointed at this service per Render's custom-domain
      # instructions - that DNS-side step is outside this repository.
      - "*.soko.market"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: APP_URL
        value: https://soko.market
      - key: AUTH_ALLOWED_REDIRECT_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: WEBAUTHN_RP_ID
        value: soko.market
      - key: WEBAUTHN_EXPECTED_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: AUTH_PASSKEYS_ENABLED
        value: "true"
      - key: AUTH_PASSWORD_FALLBACK_ENABLED
        value: "true"
      - key: SESSION_ACCESS_TTL_SECONDS
        value: "900"
      - key: SESSION_INACTIVITY_TTL_DAYS
        value: "30"
      - key: SESSION_ABSOLUTE_TTL_DAYS
        value: "180"
      - key: SESSION_ROTATION_ENABLED
        value: "true"
      - key: SESSION_REUSE_DETECTION_ENABLED
        value: "true"
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: PASSWORD_HASH_SECRET
        generateValue: true
      - key: AUTH_AUDIT_HMAC_SECRET
        generateValue: true
      - key: PIN_HASH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SOKO_EMAIL_FROM
        value: "Soko <messages@soko.market>"
      - key: CP2_STORE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
      - key: DB_PERSISTENCE_QUEUE_WARN_MS
        value: "10000"
      - key: DB_SLOW_QUERY_MS
        value: "500"
      - key: GITHUB_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      # The API talks to the model gateway only over Render's private network. The browser never
      # receives the service token or the private hostname.
      - key: PLATFORM_DEFAULT_AGENT_ID
        value: builtin:pi:v1
      - key: PLATFORM_DEFAULT_AGENT_NAME
        value: Pi
      - key: PLATFORM_DEFAULT_AGENT_ADAPTER_ID
        value: pi
      - key: PLATFORM_DEFAULT_MODEL_ID
        value: smollm2-360m
      - key: PLATFORM_DEFAULT_EXECUTION_TARGET
        value: backend
      - key: BACKEND_INFERENCE_ENABLED
        value: "true"
      - key: BACKEND_INFERENCE_BASE_URL
        fromService:
          name: soko-market-inference
          type: pserv
          property: hostport
      - key: BACKEND_INFERENCE_MODEL_ID
        value: smollm2-360m
      - key: INFERENCE_SERVICE_TOKEN
        fromService:
          name: soko-market-inference
          type: pserv
          envVarKey: INFERENCE_SERVICE_TOKEN
      - key: BACKEND_INFERENCE_REQUIRED
        value: "true"
      - key: INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      # OpenAI is one optional cloud model provider, not a requirement to boot (docs/architecture/
      # provider-neutral-runtime.md). None of these four keys are required for API readiness:
      # OPENAI_API_KEY is sync: false and may be left blank in the Render dashboard - with it
      # blank, services/api/src/index.ts simply never registers the OpenAI adapter (see
      # createOpenAiProvider in services/api/src/inference/openai-provider.ts), an
      # optional-registration pattern applied uniformly to every provider adapter here. The API
      # never becomes the default or a prerequisite for readiness.
      - key: INFERENCE_CLOUD_PROVIDER
        value: openai
      - key: INFERENCE_CLOUD_MODEL_ALLOWLIST
        value: openai-fast,openai-reasoning
      - key: INFERENCE_CLOUD_MONTHLY_TOKEN_BUDGET
        value: "100000"
      - key: INFERENCE_MAX_FALLBACKS
        value: "3"
      - key: INFERENCE_JOB_TIMEOUT_MS
        value: "120000"
      - key: INFERENCE_JOB_SIGNING_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FAST_MODEL
        value: gpt-5-mini
      - key: OPENAI_REASONING_MODEL
        value: gpt-5.2
      - key: OCR_WORKER_URL
        sync: false
      - key: OCR_CONCURRENCY
        value: "1"
      - key: OCR_JOB_TIMEOUT_SECONDS
        value: "120"
      - key: MALWARE_SCANNER_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:operations@soko.market
      - key: REDIS_URL
        fromService:
          name: soko-market-rate-limit-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: soko-market-rate-limit-cache
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: pserv
    name: soko-market-inference
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    plan: starter
    region: oregon
    dockerfilePath: ./services/ai-runtime/Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 60
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - packages/shared-types/**
        - services/ai-runtime/**
    disk:
      name: soko-inference-models
      mountPath: /var/lib/soko-models
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: PORT
        value: "4002"
      - key: INFERENCE_SERVICE_TOKEN
        generateValue: true
      - key: INFERENCE_ENGINE
        value: ollama
      - key: SOKO_PRIMARY_MODEL_ID
        value: smollm2-360m
      - key: SOKO_PRIMARY_PROVIDER_MODEL_ID
        value: smollm2:360m-instruct-q4_0
      - key: MODEL_STORAGE_PATH
        value: /var/lib/soko-models
      - key: MODEL_STORAGE_DURABLE
        value: "true"
      - key: MODEL_AUTO_INSTALL
        value: "true"
      - key: OLLAMA_KEEP_ALIVE
        value: 10m
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: REDIS_URL
        fromService:
          name: soko-market-rate-limit-cache
          type: keyvalue
          property: connectionString

  - type: web
    name: soko-market-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/web... build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
    domains:
      - soko.market
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; child-src 'self'; connect-src 'self' https://*.soko.market wss://*.soko.market; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /icons/*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_BASE_URL
        value: https://api.soko.market
      - key: VITE_DEPLOYMENT_ENV
        value: production
      - key: VITE_INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      - key: VITE_INFERENCE_MAX_FALLBACKS
        value: "3"

  - type: web
    name: soko-market-web-staging
    runtime: static
    branch: agent/passkey-auth
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/web... build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; child-src 'self'; connect-src 'self' https://*.soko.market wss://*.soko.market; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEPLOYMENT_ENV
        value: staging
      - key: VITE_INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      - key: VITE_INFERENCE_MAX_FALLBACKS
        value: "3"

  - type: cron
    name: soko-market-db-backup
    runtime: node
    branch: main
    schedule: "17 2 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:backup
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_UPLOAD_COMMAND
        sync: false

  - type: cron
    name: soko-market-shop-purge
    runtime: node
    branch: main
    schedule: "37 3 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-shops
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

  - type: cron
    name: soko-market-account-purge
    runtime: node
    branch: main
    schedule: "7 4 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-accounts
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: ACCOUNT_DELETION_PROCESSORS_JSON
        sync: false
      - key: ACCOUNT_DELETION_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: soko-market-db-health
    runtime: node
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
