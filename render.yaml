databases:
  - name: soko-market-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: soko_market
    user: soko_market
    ipAllowList: []

services:
  - type: web
    name: soko-market-api
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: free
    region: oregon
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api... build && COREPACK_HOME=/tmp/corepack corepack pnpm check:production-imports
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:migrate && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api start
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/ai-runtime/**
        - services/api/**
    domains:
      - api.soko.market
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: APP_URL
        value: https://soko.market
      - key: AUTH_ALLOWED_REDIRECT_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: WEBAUTHN_RP_ID
        value: soko.market
      - key: CP2_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
      - key: DB_SLOW_QUERY_MS
        value: "500"
      - key: GITHUB_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: LOCAL_MODEL_ENABLED
        sync: false
      - key: LOCAL_MODEL_PROVIDER
        value: ollama
      - key: LOCAL_MODEL_ENDPOINT
        sync: false
      - key: LOCAL_MODEL_ID
        value: qwen2.5-0.5b-android
      - key: LOCAL_MODEL_MODEL
        value: qwen2.5:0.5b
      - key: LOCAL_MODEL_TIMEOUT_MS
        value: "90000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FAST_MODEL
        value: gpt-5-mini
      - key: OPENAI_REASONING_MODEL
        value: gpt-5.2
      - key: OCR_WORKER_URL
        sync: false
      - key: OCR_CONCURRENCY
        value: "1"
      - key: OCR_JOB_TIMEOUT_SECONDS
        value: "120"
      - key: MALWARE_SCANNER_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:operations@soko.market

  - type: web
    name: soko-market-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/web... build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
    domains:
      - soko.market
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /icons/*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://api.soko.market
      - key: VITE_DEPLOYMENT_ENV
        value: production

  - type: web
    name: soko-market-web-staging
    runtime: static
    branch: agent/passkey-auth
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/web... build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
        - scripts/benchmark-browser-inference.mjs
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://*.soko.market wss://*.soko.market https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEPLOYMENT_ENV
        value: staging
      - key: VITE_BROWSER_LOCAL_INFERENCE_ENABLED
        value: "true"

  - type: cron
    name: soko-market-db-backup
    runtime: node
    branch: main
    schedule: "17 2 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:backup
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_UPLOAD_COMMAND
        sync: false

  - type: cron
    name: soko-market-shop-purge
    runtime: node
    branch: main
    schedule: "37 3 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-shops
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString

  - type: cron
    name: soko-market-account-purge
    runtime: node
    branch: main
    schedule: "7 4 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-accounts
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: ACCOUNT_DELETION_PROCESSORS_JSON
        sync: false
      - key: ACCOUNT_DELETION_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: soko-market-db-health
    runtime: node
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: soko-market-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
