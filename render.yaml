services:
  - type: web
    name: soko-market-api
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: free
    region: oregon
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/api start
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - packages/**
        - services/ai-runtime/**
        - services/api/**
    domains:
      - api.soko.market
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://soko.market,https://www.soko.market
      - key: MONGODB_URI
        sync: false
      - key: TWILIO_VERIFY_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

  - type: web
    name: soko-market-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @soko/web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
    domains:
      - soko.market
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://api.soko.market
      - key: VITE_DEPLOYMENT_ENV
        value: production
