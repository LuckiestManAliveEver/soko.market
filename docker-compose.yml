services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soko_market
      POSTGRES_PASSWORD: soko_dev_password
      POSTGRES_USER: soko
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soko -d soko_market"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - soko-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - soko-redis-data:/data

  ai-runtime:
    build:
      context: .
      dockerfile: ./services/ai-runtime/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4002"
      # Fixed local-loopback token, kept in sync with .env.example's INFERENCE_SERVICE_TOKEN so the
      # API and this gateway agree without any manual setup step. Never reused outside local dev.
      INFERENCE_SERVICE_TOKEN: ${INFERENCE_SERVICE_TOKEN:-a30b3c0bcd66528537039cf4b5aada5634c0db48bbf7dcd2}
      INFERENCE_ENGINE: ollama
      SOKO_PRIMARY_MODEL_ID: ${SOKO_PRIMARY_MODEL_ID:-smollm2-360m}
      SOKO_PRIMARY_PROVIDER_MODEL_ID: ${SOKO_PRIMARY_PROVIDER_MODEL_ID:-smollm2:360m-instruct-q4_0}
      MODEL_STORAGE_PATH: /var/lib/soko-models
      MODEL_STORAGE_DURABLE: "true"
      MODEL_AUTO_INSTALL: "true"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: "1"
      REDIS_URL: redis://redis:6379
    ports:
      - "4002:4002"
    volumes:
      - soko-ai-runtime-models:/var/lib/soko-models
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      # The first boot pulls the model from Ollama's registry before the gateway process even
      # starts listening; give it generous room instead of flapping unhealthy during that pull.
      retries: 60
      start_period: 30s

  receipt-ocr-worker:
    profiles: ["ocr"]
    build:
      context: ./services/receipt-ocr-service
    environment:
      OCR_ENGINE_PRIMARY: ${OCR_ENGINE_PRIMARY:-paddleocr}
      OCR_ENGINE_FALLBACK: ${OCR_ENGINE_FALLBACK:-tesseract}
      OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-true}
      OCR_PROFILE: ${OCR_PROFILE:-balanced}
      OCR_LANGUAGE_HINTS: ${OCR_LANGUAGE_HINTS:-en,sw}
      OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-10}
      OCR_MAX_IMAGE_EDGE: ${OCR_MAX_IMAGE_EDGE:-3000}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-5}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      OCR_WORKER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  soko-postgres-data:
  soko-redis-data:
  soko-ai-runtime-models:
