services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soko_market
      POSTGRES_PASSWORD: soko_dev_password
      POSTGRES_USER: soko
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soko -d soko_market"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - soko-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - soko-redis-data:/data

  receipt-ocr-worker:
    profiles: ["ocr"]
    build:
      context: ./services/receipt-ocr-service
    environment:
      OCR_ENGINE_PRIMARY: ${OCR_ENGINE_PRIMARY:-paddleocr}
      OCR_ENGINE_FALLBACK: ${OCR_ENGINE_FALLBACK:-tesseract}
      OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-true}
      OCR_PROFILE: ${OCR_PROFILE:-balanced}
      OCR_LANGUAGE_HINTS: ${OCR_LANGUAGE_HINTS:-en,sw}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  soko-postgres-data:
  soko-redis-data:
