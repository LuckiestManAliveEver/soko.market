  <text x="180" y="296" font-family="Arial, sans-serif" font-size="18" fill="#516258">Create invoices, add products, follow up customers.</text>
  <rect x="150" y="348" width="250" height="180" rx="16" fill="#f7f8f6" stroke="#dbe4dc" stroke-width="3"/>
  <text x="178" y="392" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17211b">Products</text>
  <text x="178" y="432" font-family="Arial, sans-serif" font-size="18" fill="#516258">Stock and catalogue</text>
  <rect x="430" y="348" width="250" height="180" rx="16" fill="#f7f8f6" stroke="#dbe4dc" stroke-width="3"/>
  <text x="458" y="392" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17211b">Payments</text>
  <text x="458" y="432" font-family="Arial, sans-serif" font-size="18" fill="#516258">Cash and M-Pesa</text>
  <rect x="710" y="348" width="250" height="180" rx="16" fill="#f7f8f6" stroke="#dbe4dc" stroke-width="3"/>
  <text x="738" y="392" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17211b">Storefront</text>
  <text x="738" y="432" font-family="Arial, sans-serif" font-size="18" fill="#516258">Shop ID and chat</text>
  <circle cx="1010" cy="438" r="64" fill="#117a4f"/>
  <polygon points="990,402 990,474 1050,438" fill="#ffffff"/>
  <text x="150" y="598" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f5c3d">30 second setup guide</text>
  <text x="150" y="628" font-family="Arial, sans-serif" font-size="18" fill="#516258">Sign up, register your business, set your PIN, and start selling.</text>
