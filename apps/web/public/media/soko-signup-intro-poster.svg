<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Soko.market signup intro poster</title>
  <desc id="desc">A storefront workspace preview with chat, products, payments, and customer care.</desc>
  <rect width="1280" height="720" fill="#eef2f0"/>
  <rect x="90" y="72" width="1100" height="576" rx="24" fill="#ffffff" stroke="#cfdad2" stroke-width="4"/>
  <rect x="130" y="112" width="1020" height="82" rx="16" fill="#113f67"/>
  <circle cx="176" cy="153" r="24" fill="#ffffff"/>
  <text x="176" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#113f67">S</text>
  <text x="222" y="146" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Soko.market</text>
  <text x="222" y="176" font-family="Arial, sans-serif" font-size="18" fill="#dce8f2">Chat, catalogue, payments and storefront in one shop workspace</text>
  <rect x="150" y="232" width="420" height="88" rx="14" fill="#edf4ee" stroke="#cfe0d2" stroke-width="3"/>
