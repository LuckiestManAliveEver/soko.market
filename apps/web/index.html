<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#117a4f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Soko" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/soko-icon.svg" type="image/svg+xml" />
    <title>Soko.market</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      async function boot() {
        if (import.meta.env.DEV && "serviceWorker" in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ("caches" in globalThis) {
              const cacheNames = await globalThis.caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith("soko-market-app-"))
                  .map((cacheName) => globalThis.caches.delete(cacheName))
              );
            }
          } catch (error) {
            console.warn("Unable to clear the development service worker cache.", error);
          }
        }

        await import("/src/main.tsx");
      }

      void boot();
    </script>
  </body>
</html>
